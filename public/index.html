<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%2335e0ff' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2335e0ff' stroke-width='2' stroke-dasharray='6 4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2335e0ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#03050a;
    --window:#0a1220;
    --panel:#0e1a2bcc;
    --edge:#1c3049;
    --arc:#35e0ff;
    --arc-dim:#1a8fb0;
    --gold:#ffb84d;
    --text:#d7e9f4;
    --muted:#6f8ba3;
    --user:#16283f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--text); overflow:hidden;
    font-family:'Rajdhani',system-ui,sans-serif; font-size:16px; line-height:1.5;
    position:relative;
  }

  /* ---------- fundo: campo estelar + scanlines + vinheta ---------- */
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bgfx .grid{
    position:absolute;inset:-2px;
    background-image:
      linear-gradient(rgba(53,224,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,224,255,.05) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 78%);
    animation:gridshift 22s linear infinite;
  }
  @keyframes gridshift{to{background-position:42px 42px, 42px 42px}}
  .bgfx .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 50%, transparent 40%, #03050a 100%)}
  .bgfx .scan{
    position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px);
  }
  #fx{position:fixed;inset:0;z-index:1;pointer-events:none}

  /* ---------- titlebar ---------- */
  .titlebar{
    position:relative;z-index:5;
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    border-bottom:1px solid var(--edge);background:rgba(5,8,15,.45);backdrop-filter:blur(6px);
  }
  .dots{display:flex;gap:6px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#22354d;display:block}
  .titlebar .name{font-family:'Michroma',sans-serif;font-size:11px;letter-spacing:.34em;margin-left:6px;text-shadow:0 0 12px rgba(53,224,255,.5)}
  .chip{
    font-size:11px;letter-spacing:.14em;padding:2px 10px;border-radius:999px;
    border:1px solid var(--edge);color:var(--muted);cursor:default;user-select:none;
    transition:all .25s;
  }
  .chip.on{color:var(--arc);border-color:rgba(53,224,255,.35);box-shadow:0 0 10px rgba(53,224,255,.25) inset}
  .chip.warn{color:var(--gold);border-color:rgba(255,184,77,.35)}
  .chip.click{cursor:pointer}
  .chip.click:hover{border-color:var(--arc);color:var(--arc)}
  .titlebar .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* ---------- palco central: bolinha sempre no meio da tela ---------- */
  .stage{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:20px;pointer-events:none;
  }
  .reactor-zone{display:flex;flex-direction:column;align-items:center;gap:22px;pointer-events:auto}

  .reactor{position:relative;width:min(46vh,300px);height:min(46vh,300px);cursor:pointer}
  .reactor canvas{position:absolute;inset:-40%;width:180%;height:180%;pointer-events:none}
  .reactor .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(53,224,255,.35);transition:opacity .4s}
  .reactor .ring.r2{inset:15%;border-style:dashed;animation:spin 14s linear infinite}
  .reactor .ring.r3{inset:30%;border-color:rgba(53,224,255,.6);animation:spin 9s linear infinite reverse}
  .reactor .core{
    position:absolute;inset:46%;border-radius:50%;
    background:radial-gradient(circle, #d9fbff 0%, var(--arc) 45%, rgba(53,224,255,.15) 100%);
    box-shadow:0 0 34px rgba(53,224,255,.75), 0 0 90px rgba(53,224,255,.3);
    animation:pulse 2.6s ease-in-out infinite;
    transition:opacity .4s, box-shadow .3s;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{box-shadow:0 0 20px rgba(53,224,255,.5),0 0 60px rgba(53,224,255,.2)}}
  @keyframes pulsefast{50%{box-shadow:0 0 16px rgba(53,224,255,.4),0 0 40px rgba(53,224,255,.15)}}

  /* estados */
  body[data-state="idle"] .reactor .core{opacity:.35;box-shadow:none;animation:none}
  body[data-state="idle"] .reactor .ring{opacity:.4}
  body[data-state="idle"] .reactor .ring.r2, body[data-state="idle"] .reactor .ring.r3{animation-play-state:paused}
  body[data-state="listening"] .reactor .core{animation:pulsefast 1.2s ease-in-out infinite}
  body[data-state="thinking"] .reactor .ring.r2{animation-duration:3.5s}
  body[data-state="thinking"] .reactor .ring.r3{animation-duration:2s}
  body[data-state="speaking"] .reactor .core,
  body[data-state="confirming"] .reactor .core{
    background:radial-gradient(circle, #fff3dd 0%, var(--gold) 45%, rgba(255,184,77,.15) 100%);
    box-shadow:0 0 34px rgba(255,184,77,.75), 0 0 90px rgba(255,184,77,.3);
    animation:pulsegold 1s ease-in-out infinite;
  }
  @keyframes pulsegold{50%{box-shadow:0 0 18px rgba(255,184,77,.5),0 0 50px rgba(255,184,77,.2)}}

  .state{font-family:'Michroma',sans-serif;font-size:12px;letter-spacing:.3em;color:var(--arc);text-align:center;min-height:16px;text-shadow:0 0 10px rgba(53,224,255,.5)}
  body[data-state="speaking"] .state, body[data-state="confirming"] .state{color:var(--gold);text-shadow:0 0 10px rgba(255,184,77,.5)}

  .wave{display:flex;gap:4px;align-items:flex-end;height:30px;opacity:0;transition:opacity .3s}
  body[data-state="listening"] .wave, body[data-state="speaking"] .wave{opacity:1}
  .wave i{width:4px;background:var(--arc-dim);border-radius:2px;animation:wv 1.1s ease-in-out infinite;transition:background .3s}
  body[data-state="speaking"] .wave i{background:var(--gold)}
  .wave i:nth-child(1){height:8px}.wave i:nth-child(2){height:18px;animation-delay:.1s}
  .wave i:nth-child(3){height:26px;animation-delay:.2s}.wave i:nth-child(4){height:14px;animation-delay:.3s}
  .wave i:nth-child(5){height:22px;animation-delay:.4s}.wave i:nth-child(6){height:10px;animation-delay:.5s}
  @keyframes wv{50%{transform:scaleY(.45)}}

  .interim{font-size:14px;color:var(--muted);font-style:italic;min-height:20px;max-width:min(80vw,420px);text-align:center}

  @media (prefers-reduced-motion:reduce){
    .reactor .ring,.reactor .core,.wave i{animation:none !important}
  }

  /* ---------- gaveta de conversa (desliza da direita) ---------- */
  .logdrawer{
    position:fixed;top:0;right:0;bottom:0;z-index:6;
    width:min(420px,92vw);
    background:rgba(8,13,22,.72);backdrop-filter:blur(14px);
    border-left:1px solid var(--edge);
    display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);
    box-shadow:-30px 0 60px rgba(0,0,0,.4);
  }
  .logdrawer.open{transform:translateX(0)}
  .logdrawer .dhead{
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--edge);flex-shrink:0;
  }
  .logdrawer .dhead .name{font-family:'Michroma',sans-serif;font-size:11px;letter-spacing:.3em}
  .logdrawer .dhead .close{margin-left:auto;cursor:pointer;color:var(--muted);background:none;border:0;font-size:18px;padding:2px 8px;border-radius:6px}
  .logdrawer .dhead .close:hover{color:var(--text);background:rgba(53,224,255,.08)}
  .msgs{display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto;padding:16px}
  .msg{max-width:92%;padding:10px 14px;border-radius:10px;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .msg .who{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .msg.user{background:var(--user);align-self:flex-end;border:1px solid #24405f}
  .msg.jarvis{background:var(--panel);border:1px solid var(--edge)}
  .msg.jarvis .who{color:var(--arc-dim)}
  .toolline{
    font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;
    display:flex;align-items:center;gap:8px;min-height:18px;padding:0 16px;
  }
  .toolline:empty{display:none}
  .toolline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex-shrink:0}
  .confirmbox{
    border:1px solid rgba(255,184,77,.5);border-radius:10px;padding:12px 14px;background:rgba(255,184,77,.06);
    display:flex;flex-direction:column;gap:10px;font-size:14px;
  }
  .confirmbox .btns{display:flex;gap:8px}
  .confirmbox button{
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;padding:6px 18px;
    border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--text);cursor:pointer;
  }
  .confirmbox button.yes{background:var(--gold);border-color:var(--gold);color:#2b1c00}

  /* toggle da gaveta + indicador de mensagem nova */
  #chip-log{position:relative}
  #chip-log .dot{
    position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;transition:opacity .3s;
  }
  #chip-log.unread .dot{opacity:1}

  /* ---------- barra flutuante inferior: input + mic ---------- */
  .inputbar{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;
    width:min(560px,92vw);
    display:flex;gap:8px;border:1px solid var(--edge);border-radius:14px;
    padding:8px 8px 8px 16px;align-items:center;
    background:rgba(8,13,22,.65);backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .inputbar input{
    flex:1;background:none;border:0;outline:0;color:var(--text);
    font-family:inherit;font-size:15px;
  }
  .inputbar input::placeholder{color:var(--muted)}
  .micbtn{
    background:none;border:0;cursor:pointer;font-size:19px;padding:6px 10px;border-radius:8px;
    color:var(--arc);transition:background .2s;
  }
  .micbtn:hover{background:rgba(53,224,255,.1)}
  .micbtn.off{color:var(--muted);filter:grayscale(1)}

  /* ---------- modo mini (janela compacta) ---------- */
  body.mini .statusbar{display:none}
  body.mini .reactor{width:min(34vh,150px);height:min(34vh,150px)}
  body.mini .titlebar{padding:6px 12px}
  body.mini .interim{font-size:12px}
  body.mini .state{font-size:10px}

  /* ---------- statusbar ---------- */
  .statusbar{
    position:fixed;left:0;right:0;bottom:0;z-index:4;
    display:flex;gap:18px;flex-wrap:wrap;padding:7px 18px 26px;
    font-size:11px;letter-spacing:.1em;color:var(--muted);
    pointer-events:none;
  }
  .statusbar b{color:var(--arc-dim);font-weight:600}

  /* ---------- painel de personalidade ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(5,8,15,.72);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .overlay[hidden]{display:none !important}
  .settings-win{
    background:var(--window);border:1px solid var(--edge);border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(53,224,255,.05);
    width:min(680px,100%);max-height:92vh;overflow-y:auto;
  }
  .settings-win .head{
    display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--edge);background:rgba(5,8,15,.5);
    position:sticky;top:0;
  }
  .settings-win .head .name{font-family:'Michroma',sans-serif;font-size:11px;letter-spacing:.3em}
  .settings-win .head .close{
    margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;background:none;border:0;
    padding:2px 8px;border-radius:6px;
  }
  .settings-win .head .close:hover{color:var(--text);background:rgba(53,224,255,.08)}
  .settings{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media (max-width:640px){.settings{grid-template-columns:1fr}}
  .field label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .preset{
    padding:7px 16px;border-radius:999px;border:1px solid var(--edge);font-size:14px;
    font-weight:600;letter-spacing:.06em;color:var(--muted);cursor:pointer;background:none;
    font-family:inherit;
  }
  .preset.on{color:#04222c;background:var(--arc);border-color:var(--arc);box-shadow:0 0 16px rgba(53,224,255,.4)}
  .slider{margin-bottom:14px}
  .slider .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
  .slider .val{font-variant-numeric:tabular-nums;color:var(--arc-dim);font-weight:600}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--arc-dim),var(--arc)) 0/var(--fill,50%) 100% no-repeat, var(--edge);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#d9fbff;
    box-shadow:0 0 10px rgba(53,224,255,.7);cursor:pointer;border:0;
  }
  .textbox,select.textbox{
    width:100%;border:1px solid var(--edge);border-radius:8px;padding:9px 14px;font-size:15px;
    color:var(--text);background:var(--panel);font-family:inherit;outline:none;
  }
  .textbox:focus{border-color:rgba(53,224,255,.4)}
  .tg{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-top:4px}
  .sw{width:38px;height:20px;border-radius:999px;background:var(--edge);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:4px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:all .2s}
  .sw.on{background:rgba(53,224,255,.25)}
  .sw.on::after{left:auto;right:4px;background:var(--arc);box-shadow:0 0 8px rgba(53,224,255,.7)}

  #unlock{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:rgba(255,184,77,.12);border:1px solid rgba(255,184,77,.5);color:var(--gold);
    padding:8px 20px;border-radius:999px;font-size:13px;letter-spacing:.08em;z-index:10;
    box-shadow:0 0 18px rgba(255,184,77,.25);cursor:pointer;
  }
</style>
</head>
<body data-state="idle">

<div class="bgfx"><div class="grid"></div><div class="vignette"></div><div class="scan"></div></div>
<canvas id="fx"></canvas>

<div class="titlebar">
  <div class="dots"><i></i><i></i><i></i></div>
  <span class="name">J.A.R.V.I.S.</span>
  <span class="chip" id="chip-online">● OFFLINE</span>
  <div class="right">
    <span class="chip click" id="chip-mini" title="modo compacto">▭</span>
    <span class="chip click" id="chip-log" title="ver conversa">💬 log<i class="dot"></i></span>
    <span class="chip click" id="chip-mic" title="ligar/desligar microfone">🎙 mic desligado</span>
    <span class="chip click" title="configurações">⚙</span>
  </div>
</div>

<div class="stage">
  <div class="reactor-zone">
    <div class="reactor" id="reactor" title="clique: falar / interromper">
      <canvas id="orbfx"></canvas>
      <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="core"></div>
    </div>
    <span class="state" id="state-label">STANDBY</span>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="interim" id="interim"></div>
  </div>
</div>

<div class="logdrawer" id="logdrawer">
  <div class="dhead">
    <div class="dots"><i></i><i></i><i></i></div>
    <span class="name">CONVERSA</span>
    <button class="close" id="log-close" title="fechar">✕</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="toolline" id="toolline"></div>
</div>

<div class="inputbar">
  <input id="textin" type="text" placeholder="ou digite um comando…" autocomplete="off">
  <button class="micbtn off" id="micbtn" title="ligar/desligar microfone">🎙</button>
</div>

<div class="overlay" id="settings" hidden>
  <div class="settings-win">
    <div class="head">
      <div class="dots"><i></i><i></i><i></i></div>
      <span class="name">CONFIGURAÇÕES</span>
      <span class="chip">personalidade</span>
      <button class="close" id="settings-close" title="fechar">✕</button>
    </div>
    <div class="settings">
      <div>
        <div class="field" style="margin-bottom:20px">
          <label>Preset</label>
          <div class="presets" id="presets">
            <button class="preset" data-preset="jarvis">JARVIS</button>
            <button class="preset" data-preset="friday">SEXTA-FEIRA</button>
            <button class="preset" data-preset="ultron">ULTRON</button>
            <button class="preset" data-preset="neutro">Neutro</button>
          </div>
        </div>
        <div class="slider"><div class="row"><span>Humor</span><span class="val" id="v-humor">—</span></div>
          <input type="range" id="s-humor" min="0" max="100" step="5"></div>
        <div class="slider"><div class="row"><span>Sarcasmo</span><span class="val" id="v-sarcasmo">—</span></div>
          <input type="range" id="s-sarcasmo" min="0" max="100" step="5"></div>
        <div class="slider"><div class="row"><span>Formalidade</span><span class="val" id="v-formalidade">—</span></div>
          <input type="range" id="s-formalidade" min="0" max="100" step="5"></div>
        <div class="slider"><div class="row"><span>Prolixidade</span><span class="val" id="v-prolixidade">—</span></div>
          <input type="range" id="s-prolixidade" min="0" max="100" step="5"></div>
        <div class="slider"><div class="row"><span>Velocidade da fala</span><span class="val" id="v-velocidade">—</span></div>
          <input type="range" id="s-velocidade" min="80" max="150" step="5"></div>
      </div>
      <div>
        <div class="field" style="margin-bottom:16px">
          <label>Nome do assistente (muda a wake word)</label>
          <input class="textbox" id="f-nome" maxlength="30">
        </div>
        <div class="field" style="margin-bottom:16px">
          <label>Tratamento</label>
          <input class="textbox" id="f-tratamento" maxlength="30" placeholder="senhor, chefe…">
        </div>
        <div class="field" style="margin-bottom:16px">
          <label>Voz</label>
          <select class="textbox" id="f-voz">
            <option value="pt-BR-AntonioNeural">Antônio — pt-BR neural</option>
            <option value="pt-BR-FranciscaNeural">Francisca — pt-BR neural</option>
            <option value="pt-BR-ThalitaMultilingualNeural">Thalita — pt-BR multilíngue</option>
            <option value="en-US-AndrewMultilingualNeural">Andrew — grave, estilo Jarvis</option>
            <option value="en-US-BrianMultilingualNeural">Brian — polido, estilo Jarvis</option>
            <option value="en-AU-WilliamMultilingualNeural">William — britânico, estilo Jarvis</option>
            <option value="eleven:nPczCjzI2devNBz1zQrb">Brian — ElevenLabs grave ★</option>
            <option value="eleven:onwK4e9ZLuTAKqWW03F9">Daniel — ElevenLabs britânico ★</option>
            <option value="eleven:JBFqnCBsd6RMkjVDRZzb">George — ElevenLabs storyteller ★</option>
            <option value="eleven:pFZP5JQG7iQjIQuC4Bku">Lily — ElevenLabs aveludada ★</option>
            <option value="eleven:EXAVITQu4vr4xnSDxMaL">Sarah — ElevenLabs confiante ★</option>
            <option value="eleven:Xb7hH8MSUJpSbSDYk0k2">Alice — ElevenLabs britânica ★</option>
            <option value="eleven:XrExE9yKIg1WjnnlVkGX">Matilda — ElevenLabs profissional ★</option>
            <option value="eleven:zNEsdgTUa3ndwKry8Xcq">Elvis — ElevenLabs (exige plano pago)</option>
          </select>
        </div>
        <div class="field">
          <label>Comportamento</label>
          <div class="tg"><span>Sons de ativação</span><span class="sw" id="t-sons"></span></div>
          <div class="tg"><span>Confirmação verbal p/ ações sensíveis</span><span class="sw on" style="opacity:.5;cursor:default" title="sempre ativa — trava de segurança"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span>wake word: <b>"Jarvis"</b></span>
  <span>voz: <b id="sb-voice">—</b></span>
  <span>workspace: <b id="sb-ws">—</b></span>
  <span>sessão: <b id="sb-session">—</b></span>
  <span id="sb-metrics"></span>
  <span id="sb-usage"></span>
</div>

<script>
'use strict';

// ---------- estado global ----------
const $ = (id) => document.getElementById(id);
let ws = null;
let wsOk = false;
let micOn = false;
let state = 'idle';          // idle | listening | thinking | speaking | confirming
let clientTurn = 0;          // turno atual (vem do servidor via user_echo)
let confirmBox = null;

// ping sutil de "processando" (respeita o toggle de sons)
let thinkTimer = null;
function startThinkSound() {
  if (!sonsOn || thinkTimer) return;
  thinkTimer = setInterval(() => {
    try {
      const ctx = audioCtx();
      if (ctx.state !== 'running') return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 660;
      g.gain.setValueAtTime(0.02, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.3);
    } catch {}
  }, 2200);
}
function stopThinkSound() { clearInterval(thinkTimer); thinkTimer = null; }

function setState(s) {
  state = s;
  if (s === 'thinking') startThinkSound(); else stopThinkSound();
  document.body.dataset.state = (s === 'confirming') ? 'confirming' : s;
  $('state-label').textContent = {
    idle: micOn ? `STANDBY · DIGA "${(persCfg.nome || 'JARVIS').toUpperCase()}"` : 'MIC DESLIGADO',
    listening: 'OUVINDO',
    thinking: 'PROCESSANDO…',
    speaking: 'FALANDO',
    confirming: 'AGUARDANDO CONFIRMAÇÃO',
  }[s] || s.toUpperCase();
}

const PRESET_DEFAULTS = {

  friday: { nome: 'Sexta-feira', tratamento: 'chefe', voz: 'eleven:Xb7hH8MSUJpSbSDYk0k2', humor: .7, sarcasmo: .4, formalidade: .2, prolixidade: .3 },

// ---------- wake word (Fase 2) ----------
const WAKE_VARIANTS = {
  jarvis: ['jarvis', 'djarvis', 'jarves', 'jarbis', 'járvis', 'jarvys'],
  friday: ['friday', 'fraidei', 'fraide', 'frida', 'fridei'],
  'sexta-feira': ['sexta-feira', 'sexta feira', 'sextafeira'],
  ultron: ['ultron', 'últron', 'utron', 'ultrom'],
};
let WAKE_LIST = ['jarvis'];
let WAKE = buildWake('Jarvis');
function buildWake(nome) {
  const n = (nome || 'Jarvis').toLowerCase();
  const vs = WAKE_VARIANTS[n] || [n];
  WAKE_LIST = vs;
  return new RegExp(`\\b(${vs.map((v) => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})\\b`, 'i');
}

// tolerância a erro de transcrição: aceita a wake word com 1 letra errada
function stripAcc(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function within1(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return edits + (la - i) + (lb - j) <= 1;
}
function fuzzyWake(text) {
  const targets = WAKE_LIST.filter((v) => !v.includes(' ') && v.length >= 5).map(stripAcc);
  if (!targets.length) return null;
  const re = /[\p{L}\p{N}-]+/gu;
  let w;
  while ((w = re.exec(text)) !== null) {
    const word = stripAcc(w[0].toLowerCase());
    if (word.length >= 4 && targets.some((t) => within1(word, t))) {
      return { index: w.index, 0: w[0] };
    }
  }
  return null;
}
const CONV_MS = 90000;  // janela de conversa: classificador decide sem wake word
const HOT_MS = 10000;   // logo após a resposta: aceita direto, sem classificar
let awakeUntil = 0;
let hotUntil = 0;
let awakeTimer = null;
function isAwake() { return Date.now() < awakeUntil; }
function wake(ms = CONV_MS) {
  awakeUntil = Date.now() + ms;
  if (state === 'idle') setState('listening');
  clearTimeout(awakeTimer);
  awakeTimer = setTimeout(() => {
    if (!isAwake() && state === 'listening' && !audioPlaying()) setState('idle');
  }, ms + 60);
}
function sleepAgain() { awakeUntil = 0; clearTimeout(awakeTimer); }

// blip de ativação (gerado por síntese — sem asset)
function blip() {
  if (!sonsOn) return;
  try {
    const ctx = audioCtx();
    if (ctx.state !== 'running') return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1560, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.24);
  } catch {}
}

// decide o destino de cada frase final transcrita
// ---------- modo ditado ----------
let dictating = false;
let dictBuf = '';
function startDictation() {
  dictating = true; dictBuf = '';
  $('state-label').textContent = 'DITANDO · DIGA "TERMINEI"';
  $('interim').textContent = '📝 pode ditar…';
}
function endDictation(cancel = false) {
  dictating = false;
  const texto = dictBuf.trim();
  dictBuf = '';
  setState(state); // restaura o rótulo
  if (cancel || !texto) { $('interim').textContent = 'ditado descartado'; return; }
  submitText(`Anote o seguinte ditado num arquivo de notas em ~/Documentos/notas/ (crie a pasta se precisar, nome com a data de hoje), sem interpretar como comando, e confirme em uma frase: "${texto}"`);
}

function handleFinal(text, alts = []) {
  // modo ditado: tudo vira texto, nada vira comando, até "terminei"
  if (dictating) {
    if (/\b(terminei|fim do ditado|acabei|encerra o ditado)\b/i.test(text)) { endDictation(); return; }
    if (/\b(cancela o ditado|esquece o ditado)\b/i.test(text)) { endDictation(true); return; }
    dictBuf += (dictBuf ? ' ' : '') + text;
    $('interim').textContent = '📝 …' + dictBuf.slice(-70);
    return;
  }
  // procura a wake word no texto principal, nas transcrições alternativas do
  // reconhecedor e, por fim, com tolerância de 1 letra errada
  let src = text;
  let m = text.match(WAKE);
  if (!m) for (const a of alts) { const ma = a.match(WAKE); if (ma) { m = ma; src = a; break; } }
  if (!m) m = fuzzyWake(text);
  // enquanto o Jarvis fala, só wake word interessa (proteção contra eco residual)
  if (!m && audioPlaying()) return;
  if (m) {
    // texto antes da wake word na mesma frase é contexto real (ex.: "eu tava pensando
    // em X, Jarvis, faz Y") — não descarta, manda junto em vez de jogar fora
    const before = src.slice(0, m.index).replace(/[\s,.!?…]+$/, '').trim();
    const after = src.slice(m.index + m[0].length).replace(/^[\s,.!?…]+/, '').trim();
    const full = [before, after].filter(Boolean).join(', ').trim();
    blip();
    // comandos de corte: não viram turno do agente, cancelam na hora
    if (/^(cancela|para|pare|espera|sil[êe]ncio|cala|esquece|deixa)\b/i.test(after)) {
      stopAllAudio();
      send({ type: 'cancel' });
      wake(); setState('listening');
      return;
    }
    // modo ditado: "Jarvis, anota aí" / "modo ditado"
    if (/^(anota a[ií]|modo ditado|come[çc]a o ditado|abre o ditado)\b/i.test(after)) {
      startDictation();
      return;
    }
    if (full.length >= 2) submitText(full);
    else { stopAllAudio(); if (state === 'thinking' || audioPlaying()) send({ type: 'cancel' }); wake(); }
  } else if (state === 'confirming' || Date.now() < hotUntil) {
    submitText(text);                // emenda logo após a resposta (ou confirmação): direto
  } else if (isAwake()) {
    // janela de conversa: o classificador (Haiku) decide se era com ele
    $('interim').textContent = '🤔 analisando se era comigo…';
    send({ type: 'maybe_text', text });
  } else {
    // fora da janela e sem wake word: descarta, com feedback discreto
    $('interim').textContent = `“${text.slice(0, 60)}” — ignorado (sem “${persCfg.nome}”)`;
    setTimeout(() => { if (!recActive || state === 'idle') $('interim').textContent = ''; }, 1800);
  }
}

// ---------- WebSocket ----------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    wsOk = true;
    $('chip-online').textContent = '● ONLINE';
    $('chip-online').classList.add('on');
  };
  ws.onclose = () => {
    wsOk = false;
    $('chip-online').textContent = '● RECONECTANDO…';
    $('chip-online').classList.remove('on');
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    handleMessage(m);
  };
}
function send(obj) { if (wsOk) ws.send(JSON.stringify(obj)); }

function handleMessage(m) {
  switch (m.type) {
    case 'hello':
      $('sb-ws').textContent = m.workspace || '—';
      $('sb-session').textContent = m.session || '—';
      if (m.personality) applyPersonality(m.personality, m.voice);
      break;
    case 'personality':
      applyPersonality(m.config, m.voice);
      break;
    case 'hello_agent':
      $('sb-session').textContent = 'ativa · ' + (m.sessionId || '').slice(0, 8);
      break;
    case 'user_echo':
      clientTurn = m.turn;
      stopAllAudio();           // barge-in visual: turno novo mata áudio velho
      finishJarvisBubble();
      wake(CONV_MS);            // conversa engajada enquanto houver interação
      $('interim').textContent = '';
      addMsg('user', 'Matheus', m.text);
      break;
    case 'ignored':
      $('interim').textContent = `“${m.text.slice(0, 50)}” — ignorei, não era comigo`;
      setTimeout(() => { if (state === 'idle' || state === 'listening') $('interim').textContent = ''; }, 2500);
      break;
    case 'status':
      if (m.state === 'thinking') setState('thinking');
      else if (m.state === 'confirming') setState('confirming');
      else if (m.state === 'idle' && !audioPlaying()) idleOrListen();
      break;
    case 'assistant_delta':
      appendJarvisDelta(m.text);
      break;
    case 'assistant_text':
      // bloco consolidado — garante que o balão final bate com o texto oficial
      setJarvisBubble(m.text);
      break;
    case 'tool':
      $('toolline').textContent = `usando ${m.label || m.name}…`;
      break;
    case 'audio_chunk':
      if (m.turn === clientTurn) enqueueAudio(m.data);
      break;
    case 'audio_stop':
      stopAllAudio();
      break;
    case 'tts_fallback':
      if (m.turn === clientTurn) speakFallback(m.text);
      break;
    case 'confirm_request':
      showConfirm(m.question);
      break;
    case 'turn_end':
      $('toolline').textContent = '';
      finishJarvisBubble();
      if (m.ms) $('sb-metrics').innerHTML = `último turno: <b>${(m.ms / 1000).toFixed(1)}s</b>`;
      if (!audioPlaying()) idleOrListen();
      break;
    case 'metrics':
      if (m.firstAudioMs) $('sb-metrics').innerHTML = `1º áudio: <b>${(m.firstAudioMs / 1000).toFixed(1)}s</b>`;
      break;
    case 'usage':
      $('sb-usage').innerHTML =
        (m.elevenLimit ? `voz: <b>${((m.elevenUsed / m.elevenLimit) * 100).toFixed(0)}%</b> do mês · ` : '') +
        `turnos hoje: <b>${m.turnsToday}</b>`;
      break;
    case 'error':
      addMsg('jarvis', 'Sistema', m.text);
      break;
    case 'notice':
      addMsg('jarvis', 'Jarvis', m.text);
      break;
    case 'reload':
      if (!audioPlaying() && state !== 'thinking') location.reload();
      else setTimeout(() => location.reload(), 6000);
      break;
  }
}

// ---------- gaveta de conversa ----------
const logDrawer = $('logdrawer') || document.getElementById('logdrawer');
function isLogOpen() { return document.getElementById('logdrawer').classList.contains('open'); }
function setLogOpen(open) {
  document.getElementById('logdrawer').classList.toggle('open', open);
  try { localStorage.setItem('jarvis_log_open', open ? '1' : '0'); } catch {}
  if (open) markLogRead();

function markUnread() { if (!isLogOpen()) $('chip-log').classList.add('unread'); }
function markLogRead() { $('chip-log').classList.remove('unread'); }

// ---------- log ----------
let jarvisBubble = null;
function addMsg(cls, who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  const w = document.createElement('span'); w.className = 'who'; w.textContent = who;
  d.appendChild(w);
  d.appendChild(document.createTextNode(text));
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  markUnread();
  return d;
}
function ensureJarvisBubble() {
  if (!jarvisBubble) jarvisBubble = addMsg('jarvis', 'Jarvis', '');
  return jarvisBubble;
}
function appendJarvisDelta(t) {
  const b = ensureJarvisBubble();
  b.appendChild(document.createTextNode(t));
  $('msgs').scrollTop = $('msgs').scrollHeight;
  markUnread();
}
function setJarvisBubble(t) {
  const b = ensureJarvisBubble();
  while (b.childNodes.length > 1) b.removeChild(b.lastChild);
  b.appendChild(document.createTextNode(t));
}
function finishJarvisBubble() { jarvisBubble = null; }

// ---------- confirmação ----------
function showConfirm(question) {
  removeConfirm();
  setLogOpen(true); // confirmação sensível: abre a gaveta pra garantir que é vista
  confirmBox = document.createElement('div');
  confirmBox.className = 'confirmbox';
  confirmBox.innerHTML = `<span>⚠ ${question}</span>`;
  const btns = document.createElement('div');
  btns.className = 'btns';
  const yes = document.createElement('button'); yes.className = 'yes'; yes.textContent = 'Sim, confirmo';
  const no = document.createElement('button'); no.textContent = 'Negar';
  yes.onclick = () => { send({ type: 'confirm_response', approved: true }); removeConfirm(); };
  no.onclick = () => { send({ type: 'confirm_response', approved: false }); removeConfirm(); };
  btns.append(yes, no);
  confirmBox.appendChild(btns);
  $('msgs').appendChild(confirmBox);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function removeConfirm() { confirmBox?.remove(); confirmBox = null; }

// ---------- áudio (fila gapless via Web Audio) + analisador p/ visualizador ----------
let actx = null;
let analyser = null;
let nextTime = 0;
let activeSources = [];
let pendingDecodes = 0;

function audioCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    analyser.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function audioPlaying() { return activeSources.length > 0 || pendingDecodes > 0; }

async function enqueueAudio(b64) {
  const ctx = audioCtx();
  pendingDecodes++;
  try {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const audio = await ctx.decodeAudioData(buf.buffer);
    pendingDecodes--;
    const src = ctx.createBufferSource();
    src.buffer = audio;
    src.connect(analyser);
    const startAt = Math.max(ctx.currentTime + 0.06, nextTime);
    src.start(startAt);
    nextTime = startAt + audio.duration;
    activeSources.push(src);
    if (state !== 'confirming') setState('speaking');
    // barge-in por voz: a escuta continua ligada durante a fala (AEC do Chrome
    // suprime o eco; handleFinal só aceita wake word enquanto o áudio toca)
    src.onended = () => {
      activeSources = activeSources.filter((s) => s !== src);
      if (!audioPlaying()) {
        if (state === 'speaking') idleOrListen();
        else if (state === 'confirming') resumeRecognition();
      }
    };
  } catch (e) {
    pendingDecodes--;
    console.error('decode falhou', e);
  }
}
function stopAllAudio() {
  for (const s of activeSources) { try { s.stop(); } catch {} }
  activeSources = [];
  nextTime = 0;
  speechSynthesis.cancel();
}
function speakFallback(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-BR';
  u.rate = persCfg.velocidade || 1;
  u.onstart = () => { if (state !== 'confirming') setState('speaking'); };
  u.onend = () => { if (!speechSynthesis.pending && !audioPlaying() && state === 'speaking') idleOrListen(); };
  speechSynthesis.speak(u);
}

// ---------- STT (Web Speech API) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let recActive = false;
let recWanted = false;

function initRecognition() {
  if (!SR) { addMsg('jarvis', 'Sistema', 'Reconhecimento de voz indisponível neste navegador. Use Chrome/Edge.'); return null; }
  const r = new SR();
  r.lang = 'pt-BR';
  r.interimResults = true;
  r.continuous = true;   // standby contínuo (Fase 2)
  r.onstart = () => { recActive = true; if (state === 'idle' && isAwake()) setState('listening'); };
  r.onspeechstart = () => { if (isAwake()) $('interim').textContent = '🎤 fala detectada…'; };
  r.onend = () => {
    recActive = false;
    $('interim').textContent = '';
    if (state === 'listening') setState('idle');
    // Chrome derruba a escuta sozinho: religa se ainda queremos ouvir
    // (inclusive durante a fala do Jarvis — barge-in por voz)
    if (recWanted && micOn) setTimeout(() => startRecognition(), 250);
  };
  r.onerror = (e) => {
    recActive = false;
    console.error('speech error:', e.error, e.message || '');
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      micOn = false; updateMicUi();
      addMsg('jarvis', 'Sistema', `Reconhecimento bloqueado (${e.error}). Verifique a permissão do microfone no cadeado da barra da janela.`);
    } else if (e.error === 'network') {
      addMsg('jarvis', 'Sistema', 'Reconhecimento falhou: erro de rede com o serviço de voz do Google (network). Verifique a internet.');
    } else if (e.error === 'audio-capture') {
      addMsg('jarvis', 'Sistema', 'Nenhum microfone capturável (audio-capture). Verifique o dispositivo de entrada nas configurações de som do GNOME.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      addMsg('jarvis', 'Sistema', `Reconhecimento falhou: ${e.error}`);
    }
  };
  r.maxAlternatives = 5; // várias hipóteses de transcrição — a wake word é buscada em todas
  r.onresult = (e) => {
    let interim = '', final = '';
    const alts = [];
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        final += res[0].transcript;
        for (let j = 1; j < res.length; j++) if (res[j]?.transcript) alts.push(res[j].transcript);
      } else interim += res[0].transcript;
    }
    if (interim) {
      // usuário voltou a falar: segura qualquer envio pendente — é continuação
      clearTimeout(pendTimer);
      $('interim').textContent = (pendBuf ? '⏸ ' + pendBuf.slice(-50) + ' … ' : '') + interim;
    }
    if (final.trim()) queueFinal(final.trim(), alts);
  };
  return r;
}

// ---------- paciência de escuta ----------
// O reconhecedor fecha a frase em qualquer pausa de respiração. Em vez de enviar
// na hora, os finais entram num buffer que só vira comando após silêncio real —
// retomou a fala, o pedaço novo é emendado ao anterior.
let pendBuf = '', pendAlts = [], pendTimer = null;
function queueFinal(text, alts) {
  pendBuf = (pendBuf ? pendBuf + ' ' : '') + text;
  pendAlts.push(...alts);
  // urgências não esperam: cancelamento com wake word e respostas de confirmação
  const urgent = state === 'confirming' ||
    (WAKE.test(text) && /(cancela|par[ae]|sil[êe]ncio|cala|esquece)/i.test(text));
  clearTimeout(pendTimer);
  if (urgent) { flushFinal(); return; }
  const patience = pendBuf.length < 25 ? 800 : 1600; // curto = ágil, longo = respiro
  $('interim').textContent = '⏸ ' + pendBuf.slice(-70) + ' …';
  pendTimer = setTimeout(flushFinal, patience);
}
function flushFinal() {
  clearTimeout(pendTimer);
  const t = pendBuf.trim(), a = pendAlts;
  pendBuf = ''; pendAlts = [];
  if (!t) return;
  $('interim').textContent = '';
  handleFinal(t, a);
}
function startRecognition() {
  if (!micOn || recActive) return;
  rec = rec || initRecognition();
  if (!rec) return;
  recWanted = true;
  try { rec.start(); } catch {}
}
function pauseRecognition() { recWanted = false; try { rec?.stop(); } catch {} }
function resumeRecognition() { if (micOn) { recWanted = true; startRecognition(); } }

function updateMicUi() {
  $('micbtn').classList.toggle('off', !micOn);
  const chip = $('chip-mic');
  chip.textContent = micOn ? '🎙 escuta ativa' : '🎙 modo privado';
  chip.classList.toggle('on', micOn);
  if (!micOn) { pauseRecognition(); if (state === 'listening') setState('idle'); }
  else if (!audioPlaying() && (state === 'idle' || state === 'listening')) resumeRecognition();
  if (state === 'idle') setState('idle'); // atualiza o label
}

// ---------- envio ----------
function submitText(text) {
  if (!text) return;
  audioCtx(); // desbloqueia áudio a partir de um gesto/fala
  removeConfirm();
  send({ type: 'user_text', text });
}
function idleOrListen() {
  removeConfirm();
  if (micOn) {
    wake(CONV_MS);                      // conversa segue engajada por 90s
    hotUntil = Date.now() + HOT_MS;     // e os primeiros 10s aceitam direto
    setState('listening');
    resumeRecognition();
  } else setState('idle');
}

// watchdog: se o Chrome derrubar a escuta contínua, religa sozinho
setInterval(() => {
  if (micOn && !recActive) startRecognition();
}, 5000);

// ---------- painel de personalidade ----------
const SLIDERS = ['humor', 'sarcasmo', 'formalidade', 'prolixidade'];

function applyPersonality(cfg, voice) {
  persCfg = { ...persCfg, ...cfg };
  WAKE = buildWake(persCfg.nome);
  const v = voice || persCfg.voz || '';
  const ELEVEN_NAMES = { zNEsdgTUa3ndwKry8Xcq: 'Elvis', nPczCjzI2devNBz1zQrb: 'Brian',
    onwK4e9ZLuTAKqWW03F9: 'Daniel', JBFqnCBsd6RMkjVDRZzb: 'George',
    pFZP5JQG7iQjIQuC4Bku: 'Lily', EXAVITQu4vr4xnSDxMaL: 'Sarah',
    Xb7hH8MSUJpSbSDYk0k2: 'Alice', XrExE9yKIg1WjnnlVkGX: 'Matilda' };
  $('sb-voice').textContent = v.startsWith('eleven:')
    ? (ELEVEN_NAMES[v.slice(7)] || 'ElevenLabs') + ' · ElevenLabs'
    : v.replace(/^[a-z]{2}-[A-Z]{2}-/, '').replace(/(Multilingual)?Neural/, '') + ' · pt-BR';
  document.querySelector('.statusbar b').textContent = `"${persCfg.nome}"`;
  document.querySelector('.titlebar .name').textContent =
    persCfg.nome.toUpperCase().split('').join('.') + '.';
  document.title = persCfg.nome.toUpperCase();
  if (state === 'idle') setState('idle');
  refreshSettingsUi();
}

function refreshSettingsUi() {
  for (const b of document.querySelectorAll('.preset'))
    b.classList.toggle('on', b.dataset.preset === persCfg.preset);
  for (const k of SLIDERS) {
    const el = $('s-' + k), pct = Math.round((persCfg[k] ?? 0) * 100);
    el.value = pct;
    el.style.setProperty('--fill', pct + '%');
    $('v-' + k).textContent = pct + '%';
  }
  const vel = Math.round((persCfg.velocidade || 1) * 100);
  $('s-velocidade').value = vel;
  $('s-velocidade').style.setProperty('--fill', ((vel - 80) / 70 * 100) + '%');
  $('v-velocidade').textContent = vel + '%';
  $('f-nome').value = persCfg.nome;
  $('f-tratamento').value = persCfg.tratamento;
  $('f-voz').value = persCfg.voz;
  $('t-sons').classList.toggle('on', sonsOn);
}

let sendPersTimer = null;
function sendPersonality(announce = false) {
  clearTimeout(sendPersTimer);
  sendPersTimer = setTimeout(() => {
    send({ type: 'set_personality', announce, config: { ...persCfg } });
  }, announce ? 0 : 500);
}

document.querySelector('.titlebar .right .chip:last-child').onclick = () => {
  $('settings').hidden = false; refreshSettingsUi();
};
$('settings-close').onclick = () => { $('settings').hidden = true; };
$('settings').addEventListener('click', (e) => { if (e.target === $('settings')) $('settings').hidden = true; });

$('presets').addEventListener('click', (e) => {
  const p = e.target.dataset?.preset;
  if (!p) return;
  persCfg = { ...persCfg, preset: p, ...PRESET_DEFAULTS[p] };
  applyPersonality(persCfg);
  sendPersonality(true);              // anuncia com a saudação do preset (e a voz nova)
});
for (const k of SLIDERS) {
  $('s-' + k).addEventListener('input', (e) => {
    persCfg[k] = e.target.value / 100;
    e.target.style.setProperty('--fill', e.target.value + '%');
    $('v-' + k).textContent = e.target.value + '%';
    sendPersonality();
  });
}
$('s-velocidade').addEventListener('input', (e) => {
  persCfg.velocidade = e.target.value / 100;
  e.target.style.setProperty('--fill', ((e.target.value - 80) / 70 * 100) + '%');
  $('v-velocidade').textContent = e.target.value + '%';
  sendPersonality();
});
$('s-velocidade').addEventListener('change', () => sendPersonality(true)); // ouve o resultado
$('f-nome').addEventListener('change', (e) => {
  persCfg.nome = e.target.value.trim() || 'Jarvis';
  applyPersonality(persCfg); sendPersonality();
});
$('f-tratamento').addEventListener('change', (e) => { persCfg.tratamento = e.target.value.trim(); sendPersonality(); });
$('f-voz').addEventListener('change', (e) => { persCfg.voz = e.target.value; sendPersonality(true); });
$('t-sons').onclick = () => {
  sonsOn = !sonsOn;
  try { localStorage.setItem('jarvis_sons', sonsOn ? '1' : '0'); } catch {}
  $('t-sons').classList.toggle('on', sonsOn);
  if (sonsOn) blip();
};

// ---------- interações ----------
$('micbtn').onclick = () => { micOn = !micOn; updateMicUi(); };
$('chip-mic').onclick = () => { micOn = !micOn; updateMicUi(); };
$('chip-log').onclick = () => { setLogOpen(!isLogOpen()); };
$('log-close').onclick = () => { setLogOpen(false); };
$('reactor').onclick = () => {
  if (audioPlaying() || state === 'thinking') {
    // barge-in: interrompe fala e tarefa
    stopAllAudio();
    send({ type: 'cancel' });
    idleOrListen();
  } else if (!micOn) {
    micOn = true; updateMicUi();
  } else {
    blip(); wake();          // ativação manual: mesmo efeito de dizer "Jarvis"
    startRecognition();
  }
};
$('textin').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    submitText(e.target.value.trim());
    e.target.value = '';
  }
});

// modo mini: janela compacta (o tamanho da janela em si você ajusta uma vez;
// o GNOME lembra na próxima abertura)
$('chip-mini').onclick = () => {
  const on = document.body.classList.toggle('mini');
  try { localStorage.setItem('jarvis_mini', on ? '1' : '0'); } catch {}
};
try { if (localStorage.getItem('jarvis_mini') === '1') document.body.classList.add('mini'); } catch {}

connect();
setState('idle');
setLogOpen((localStorage.getItem('jarvis_log_open') ?? '0') === '1');

// standby automático ao abrir (a permissão do mic fica salva no perfil do app)
if (SR) { micOn = true; updateMicUi(); }

// desbloqueio de áudio: o Chrome exige um gesto antes de permitir som
if (audioCtx().state === 'suspended') {
  const un = document.createElement('div');
  un.id = 'unlock';
  un.textContent = '🔊 clique em qualquer lugar para ativar o som';
  document.body.appendChild(un);
  const prime = () => {
    audioCtx();
    if (actx.state !== 'suspended') { un.remove(); document.removeEventListener('click', prime); }
  };
  document.addEventListener('click', prime);
}

// =====================================================================
// VISUAIS: partículas de fundo + anel de energia do reator + onda real
// =====================================================================

// ---- campo de partículas de fundo (sutil, atrás de tudo) ----
(function bgParticles() {
  const cv = $('fx');
  const gx = cv.getContext('2d');
  let W, H, parts = [];
  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.round((W * H) / 22000);
    parts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + .3,
      vx: (Math.random() - .5) * .08, vy: (Math.random() - .5) * .08,
      a: Math.random() * .5 + .15,
    }));
  }
  addEventListener('resize', resize); resize();
  (function loop() {
    gx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      gx.beginPath();
      gx.fillStyle = `rgba(53,224,255,${p.a})`;
      gx.arc(p.x, p.y, p.r, 0, 7);
      gx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

// ---- anel de energia orbitando o reator, reage ao estado e ao áudio ----
(function orbFx() {
  const cv = $('orbfx');
  const gx = cv.getContext('2d');
  let W, H, cx, cy, baseR;
  let particles = [];
  const N = 42;

  function resize() {
    const rect = $('reactor').getBoundingClientRect();
    W = cv.width = rect.width * 1.8;
    H = cv.height = rect.height * 1.8;
    cx = W / 2; cy = H / 2;
    baseR = Math.min(W, H) / 2 * 0.42;
    particles = Array.from({ length: N }, (_, i) => ({
      angle: (i / N) * Math.PI * 2,
      speed: (Math.random() * .4 + .25) * (Math.random() < .5 ? 1 : -1),
      dist: baseR + Math.random() * baseR * .55,
      size: Math.random() * 1.8 + .6,
      phase: Math.random() * Math.PI * 2,
    }));
  }
  addEventListener('resize', resize);
  setTimeout(resize, 50);

  const freqData = new Uint8Array(128);
  function audioLevel() {
    if (!analyser || !audioPlaying()) return 0;
    analyser.getByteFrequencyData(freqData);
    let sum = 0; for (let i = 0; i < freqData.length; i++) sum += freqData[i];
    return Math.min(1, (sum / freqData.length) / 110);
  }

  let t = 0;
  (function loop() {
    t += 1;
    gx.clearRect(0, 0, W, H);
    if (!W) { requestAnimationFrame(loop); return; }

    const speaking = state === 'speaking' || state === 'confirming';
    const listening = state === 'listening';
    const thinking = state === 'thinking';
    const idle = state === 'idle';
    const level = speaking ? audioLevel() : 0;
    const color = speaking ? '255,184,77' : '53,224,255';
    const speedMul = thinking ? 2.6 : listening ? 1.4 : idle ? .35 : 1;
    const spread = 1 + level * 1.6;

    for (const p of particles) {
      p.angle += (p.speed * speedMul) * 0.02;
      const wobble = Math.sin(t * 0.03 + p.phase) * (baseR * 0.06) * spread;
      const d = p.dist * (idle ? .85 : 1) + wobble + level * baseR * .5;
      const x = cx + Math.cos(p.angle) * d;
      const y = cy + Math.sin(p.angle) * d * 0.94; // leve achatamento, sensação 3D
      const alpha = idle ? .12 : .35 + level * .4;
      gx.beginPath();
      gx.fillStyle = `rgba(${color},${alpha})`;
      gx.shadowColor = `rgba(${color},.8)`;
      gx.shadowBlur = 6 + level * 10;
      gx.arc(x, y, p.size * (1 + level), 0, 7);
      gx.fill();
    }
    gx.shadowBlur = 0;

    // arco de varredura (radar) — só perceptível em thinking
    if (thinking) {
      const sweepAngle = (t * 0.05) % (Math.PI * 2);
      const grad = gx.createConicGradient?.(sweepAngle, cx, cy);
      if (grad) {
        grad.addColorStop(0, 'rgba(53,224,255,.35)');
        grad.addColorStop(0.06, 'rgba(53,224,255,0)');
        grad.addColorStop(1, 'rgba(53,224,255,0)');
        gx.fillStyle = grad;
        gx.beginPath();
        gx.arc(cx, cy, baseR * 1.7, 0, Math.PI * 2);
        gx.fill();
      }
    }

    requestAnimationFrame(loop);
  })();
})();

// ---- barras de onda reagindo ao áudio real durante a fala ----
(function realWave() {
  const bars = Array.from(document.querySelectorAll('.wave i'));
  const freqData = new Uint8Array(64);
  (function loop() {
    if ((state === 'speaking') && analyser && audioPlaying()) {
      analyser.getByteFrequencyData(freqData);
      const step = Math.floor(freqData.length / bars.length);
      bars.forEach((b, i) => {
        const v = freqData[i * step] / 255;
        b.style.height = (6 + v * 26) + 'px';
        b.style.animation = 'none';
      });
    } else {
      bars.forEach((b) => { b.style.height = ''; b.style.animation = ''; });
    }
    requestAnimationFrame(loop);
  })();
})();
